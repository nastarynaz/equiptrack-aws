services:
  frontend-service:
    build: ./frontend-service
    image: equiptrack-frontend:week12
    ports:
      - "127.0.0.1:${EQUIPTRACK_PORT:-8080}:8080"
    networks: [edge]
    depends_on: [backend-service]
  backend-service:
    build: ./backend-service
    image: equiptrack-backend:week12
    environment:
      DB_HOST: db
      DB_USER: equiptrack
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    networks: [edge, database]
    depends_on:
      db:
        condition: service_healthy
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: equiptrack
      MYSQL_USER: equiptrack
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 5s
      timeout: 3s
      retries: 24
    networks: [database]
    volumes:
      - mysql-data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
networks:
  edge:
    driver: bridge
  database:
    driver: bridge
    internal: true
volumes:
  mysql-data:
